<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
    body {
        font-family: Arial, sans-serif;
        font-size: 12px;
        margin: 30px;
        color: #333;
    }

    h2 {
        text-align: center;
        color: #0d6efd;
        margin-bottom: 10px;
    }

    p {
        margin-bottom: 20px;
    }

    .descripcion {
        font-size: 13px;
        color: #555;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    th, td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: center;
    }

    th {
        background-color: #0d6efd;
        color: white;
        font-weight: bold;
    }

    tbody tr:nth-child(even) {
        background-color: #f2f2f2;
    }

    tbody tr:hover {
        background-color: #e6f0ff;
    }
</style>
</head>

<body>

    <h2>Reporte de Presupuesto - {{ presupuesto.mes }} {{ presupuesto.anio }}</h2>

    <p class="descripcion"><strong>Descripción:</strong> {{ presupuesto.descripcion }}</p>

    <table>
        <thead>
            <tr>
                <th>Ítem</th>
                <th>Monto Límite</th>
            </tr>
        </thead>
        <tbody>
            {% for d in detalles %}
            <tr>
                <td>{{ d.item.nombre }}</td>
                <td>${{ d.monto_limite }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
