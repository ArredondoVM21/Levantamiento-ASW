{% extends "base.html" %}
{% block title %}Eliminar Cuenta{% endblock %}

{% block content %}
<div class="container mt-5 text-center">

  <h2 class="fw-bold text-danger">Eliminar Cuenta</h2>
  <p class="text-muted">Esta acción es irreversible. Confirme antes de proceder.</p>

  <div class="card shadow-sm rounded-4 mx-auto mt-4" style="max-width: 600px;">
    <div class="card-body p-4">

      <h5 class="fw-bold">Boleta {{ cuenta.numero_boleta }}</h5>
      <p class="text-muted">{{ cuenta.descripcion|default:"Sin descripción" }}</p>

      <form method="POST">
        {% csrf_token %}
        <button class="btn btn-danger px-4">Eliminar</button>
        <a href="{% url 'lista_cuentas' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
      </form>

    </div>
  </div>

</div>
{% endblock %}
