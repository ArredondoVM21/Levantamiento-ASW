{% extends "base.html" %}
{% block title %}Editar Cuenta{% endblock %}

{% block content %}
<div class="container mt-5 text-center">

  <h2 class="fw-bold text-danger mb-4">Editar Cuenta por Pagar</h2>

  <div class="card shadow-sm rounded-4 mx-auto" style="max-width: 750px;">
    <div class="card-header bg-danger text-white py-3 rounded-top-4">
      <h5 class="fw-bold mb-0">Modificar Información</h5>
    </div>

    <div class="card-body p-4 text-start">

      <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="d-flex justify-content-center gap-3 mt-3">
          <button class="btn btn-danger px-4">Actualizar</button>
          <a href="{% url 'lista_cuentas' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
        </div>

      </form>

    </div>
  </div>

</div>
{% endblock %}
