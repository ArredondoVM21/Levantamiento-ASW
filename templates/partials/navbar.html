{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secreto - Helado Artesanal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar {
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .content {
      min-height: calc(100vh - 200px);
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #A61C3C;">
    <div class="container-fluid">
      <!-- logo -->
      <a class="navbar-brand d-flex align-items-center ms-5 fw-bold" href="{% url 'principal' %}">
        <img src="https://i.ibb.co/VWRKv90P/SHlogo.png" alt="Logo Secreto Helado" width="80" height="80" class="me-3">
        Secreto - Helado Artesanal
      </a>

      <button class="navbar-toggler me-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- contenido del navbar -->
      <div class="collapse navbar-collapse justify-content-end me-5" id="navbarNav">
        <ul class="navbar-nav align-items-center">

          <!-- inicio -->
          <li class="nav-item me-3">
            <a class="nav-link fs-5 {% if request.resolver_match.url_name == 'principal' %}active{% endif %}"
               href="{% url 'principal' %}">
              Inicio
            </a>
          </li>

          <!-- si el usuario está autenticado -->
          {% if user.is_authenticated %}
            <li class="nav-item me-2">
              <a href="{% url 'dashboard' %}" class="btn btn-outline-light">
                Panel de Control
              </a>
            </li>
            <li class="nav-item">
              <!-- cambio formulario para logout -->
              <form method="post" action="{% url 'logout' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                  Cerrar sesión
                </button>
              </form>
            </li>
          {% else %}
            <li class="nav-item">
              <a href="{% url 'login' %}" class="btn btn-outline-light">
                Iniciar sesión
              </a>
            </li>
          {% endif %}

        </ul>
      </div>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
